[package]
name = "magnetictb-crystal-geometry"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Exact site-orbit and periodic image geometry for MagneticTB"
license = "GPL-3.0-only"

[dependencies]
cyclotomic-nullspace = { path = "../cyclotomic-nullspace" }
magnetictb-abstract-group = { path = "../magnetictb-abstract-group" }
magnetictb-data = { path = "../magnetictb-data" }
magnetictb-linear-algebra = { path = "../magnetictb-linear-algebra" }
magnetictb-symmetry = { path = "../magnetictb-symmetry" }

[dev-dependencies]
magnetictb-representation = { path = "../magnetictb-representation" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
