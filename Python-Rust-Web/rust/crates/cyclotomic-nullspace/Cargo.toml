[package]
name = "cyclotomic-nullspace"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Exact cyclotomic common null spaces"
license = "GPL-3.0-only"

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
serde_json = { version = "1", features = ["arbitrary_precision"] }

[lib]
name = "cyclotomic_nullspace"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
