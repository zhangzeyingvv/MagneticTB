[package]
name = "magnetictb-data"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Language-neutral MagneticTB data catalog imported from the frozen Mathematica baseline"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
